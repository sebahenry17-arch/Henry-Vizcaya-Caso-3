<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario | GAME ZONE</title>
    <link rel="stylesheet" href="Asset/estilos.css">
</head>

<body>
    <header class="titulo">
        <a class="home" href="Home.html">HOME</a>
        <h3>GAME ZONE</h3>
        <div class="botones"></div>
            <a class="iniciar" href="Index.html">REGISTRARSE</a>
            <a class="iniciar" href="Login.html">INICIAR SESIÓN</a>
        </div>
    </header>

    <section class="registro">
        <div class="titulo-registro">
            <p>Registro de usuario</p>
        </div>

        <div class="datos-usuario">
            <!-- Se guardará en un diccionario 'usuarios' -->
            <label for="nombre" class="etiqueta">NOMBRE COMPLETO</label>
            <input type="name" id="nombre" class="caja-texto" maxlength="100" />

            <label for="correo" class="etiqueta">CORREO ELECTRÓNICO</label>
            <input type="email" id="correo" class="caja-texto" maxlength="60" />

            <label for="contraseña" class="etiqueta">CONTRASEÑA</label>
            <input type="password" id="contraseña" class="caja-texto" minlength="10" />

            <label for="confirm-contraseña" class="etiqueta">CONFIRMAR CONTRASEÑA</label>
            <input type="password" id="confirm-contraseña" class="caja-texto" />

            <label for="telefono" class="etiqueta">TELÉFONO (opcional)</label>
            <input type="tel" id="telefono" class="caja-texto" />
        </div>

        <div class="generos">
            <label>TIPO DE GÉNERO</label>

            <!-- Se valida la cantidad de opciones (AL MENOS 1) -->
            <!-- Se guardarán en un diccionario 'generos' aparte -->
            <div class="contenedor-generos">
                <label for="ficcion">
                    <input type="checkbox" name="genero" id="ficcion">
                    Ficción
                </label>

                <label for="terror">
                    <input type="checkbox" name="genero" id="terror">
                    Terror
                </label>

                <label for="misterio">
                    <input type="checkbox" name="genero" id="misterio">
                    Misterio
                </label>
                
                <label for="historico">
                    <input type="checkbox" name="genero" id="historico">
                    Histórico
                </label>
                
                <label for="aventura">
                    <input type="checkbox" name="genero" id="aventura">
                    Aventura
                </label>

                <label for="fantasia">
                    <input type="checkbox" name="genero" id="fantasia">
                    Fantasía
                </label>

                <label for="ciencia-ficcion">
                    <input type="checkbox" name="genero" id="ciencia-ficcion">
                    Ciencia Ficción
                </label>

                <label for="biografia">
                    <input type="checkbox" name="genero" id="biografia">
                    Biografía
                </label>

                <label for="romance">
                    <input type="checkbox" name="genero" id="romance">
                    Romance
                </label>
            </div>
        </div>

        <button class="btn-registrar">REGISTRAR</button>

    </section>
</body>
</html>
