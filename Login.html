<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión | GAME ZONE</title>
    <link rel="stylesheet" href="Asset/estilos.css">
</head>

<body>
    <header class="titulo">
        <a class="home">HOME</a>
        <h3>GAME ZONE</h3>
        <a class="iniciar">INICIAR SESIÓN</a>
    </header>

    <section class="registro">
        <div class="titulo-registro">
            <p>Inicio de sesión</p>
        </div>

        <div class="datos-usuario">
            <label for="correo" class="etiqueta">CORREO ELECTRÓNICO</label>
            <input type="email" id="correo" class="caja-texto" maxlength="60" />

            <label for="contraseña" class="etiqueta">CONTRASEÑA</label>
            <input type="password" id="contraseña" class="caja-texto" minlength="10" />
        </div>

        <button class="btn-registrar">Iniciar sesión</button>

    </section>
</body>
</html>
